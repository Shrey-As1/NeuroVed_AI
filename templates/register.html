{% extends "base.html" %}
{% block content %}

<div class="auth-wrap">
  <div class="card glass auth-card wider">
    <div class="auth-logo"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="height: 120px; width: 120px; border-radius: 12px;"></div>
    <h2>Create your account</h2>
    <p class="muted auth-sub">Start your mental wellness journey today</p>

    <form method="post" class="form auth-form" novalidate id="regForm">
      <div class="field-group">
        <label for="full_name">Full name</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input id="full_name" name="full_name" type="text" required
                 placeholder="Your full name" autocomplete="name"/>
        </div>
      </div>

      <div class="field-group">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input id="email" name="email" type="email" required
                 placeholder="you@example.com" autocomplete="email"/>
        </div>
      </div>

      <div class="field-group">
        <label for="password">Password <span class="muted small">(minimum 8 characters)</span></label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input id="password" name="password" type="password" required
                 placeholder="Create a strong password" minlength="8"
                 autocomplete="new-password"/>
          <button type="button" class="eye-btn" onclick="togglePwd('password', this)">👁</button>
        </div>
      </div>

      <div class="field-group">
        <label for="confirm_password">Confirm password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input id="confirm_password" name="confirm_password" type="password" required
                 placeholder="Repeat your password" autocomplete="new-password"/>
          <button type="button" class="eye-btn" onclick="togglePwd('confirm_password', this)">👁</button>
        </div>
        <div id="pwdMatch" class="field-hint"></div>
      </div>

      <button class="btn primary full large" type="submit">Create Account ✨</button>
    </form>

    <p class="auth-foot muted small">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="link">Sign in →</a>
    </p>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}

// Live password match feedback
const pwd = document.getElementById('password');
const cpwd = document.getElementById('confirm_password');
const hint = document.getElementById('pwdMatch');

function checkMatch() {
  if (!cpwd.value) { hint.textContent = ''; return; }
  if (pwd.value === cpwd.value) {
    hint.textContent = '✅ Passwords match';
    hint.style.color = 'var(--green)';
  } else {
    hint.textContent = '❌ Passwords do not match';
    hint.style.color = 'var(--danger)';
  }
}
pwd.addEventListener('input', checkMatch);
cpwd.addEventListener('input', checkMatch);
</script>
{% endblock %}
